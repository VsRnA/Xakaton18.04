server.port=${GAME_PORT:8081}

# DataSource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db}?currentSchema=game
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.default_schema=game

# Quartz — персистентный планировщик
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.properties.org.quartz.jobStore.isClustered=false
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
spring.quartz.properties.org.quartz.threadPool.threadCount=10
spring.quartz.auto-startup=true

# Flyway
spring.flyway.enabled=true
spring.flyway.schemas=game
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.table=flyway_schema_history

# Инициализация схемы Quartz до старта планировщика (idempotent)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:quartz-schema.sql
# SQL-скрипты выполняются ДО Hibernate DDL — defer=false означает: сначала spring.sql.init, потом JPA
spring.jpa.defer-datasource-initialization=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=24

# stoloto-core HTTP client
app.core.url=${CORE_SERVICE_URL:http://localhost:8080}
app.internal.secret=${INTERNAL_SECRET}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Outbox processor
app.outbox.batch-size=50
app.outbox.poll-interval-ms=2000

# Game timers
app.game.wait-timer-seconds=60
app.game.round-duration-seconds=30
app.game.boost-decision-seconds=5
app.game.boost-window-seconds=5
